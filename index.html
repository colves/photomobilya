<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PhotoMobilya - 3D Mutfak Önizleme</title>
    
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Three.js Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <!-- Yükleme Ekranı -->
    <div id="loader" class="overlay">
        <div class="spinner"></div>
        <p id="loader-text">Sahne Yükleniyor...</p>
    </div>

    <!-- Hata Ekranı -->
    <div id="error-screen" class="overlay hidden">
        <div class="error-box">
            <h2>Bir Hata Oluştu</h2>
            <p id="error-text"></p>
            <button id="btn-error-close" class="cam-btn" style="margin-top:16px;">Tamam</button>
        </div>
    </div>

    <!-- Bilgi Alanı -->
    <div id="info-overlay">
        <h1>PhotoMobilya</h1>
        <h2>3D Mutfak Önizleme</h2>
        <p>Görüntüyü sürükleyerek inceleyin.</p>
        <div class="model-picker-container">
            <label for="model-upload" class="model-upload-btn">Model Seç (.glb)</label>
            <input type="file" id="model-upload" accept=".glb" class="hidden-input">
        </div>
        
        <!-- Mod Değiştirici -->
        <div class="mode-toggle-container">
            <button id="btn-mode-inspect" class="mode-btn active" title="İnceleme Modu">İncele</button>
            <button id="btn-mode-walk" class="mode-btn" title="Gezinme Modu">Gezin</button>
        </div>
    </div>

    <!-- Kamera Kontrolleri (İnceleme modunda görünür) -->
    <div id="camera-controls" class="hidden">
        <button id="btn-view-reset" class="cam-btn" title="Görünümü Sıfırla">Sıfırla</button>
        <button id="btn-view-front" class="cam-btn" title="Ön Görünüm">Ön</button>
        <button id="btn-view-side" class="cam-btn" title="Yan Görünüm">Yan</button>
        <button id="btn-view-top" class="cam-btn" title="Üstten Görünüm">Üst</button>
    </div>

    <!-- Mobil Gezinme Kontrolleri (Gezinme modunda mobilde görünür) -->
    <div id="mobile-walk-controls" class="hidden">
        <div class="dpad">
            <button id="btn-walk-up" class="dpad-btn up">▲</button>
            <button id="btn-walk-left" class="dpad-btn left">◀</button>
            <button id="btn-walk-down" class="dpad-btn down">▼</button>
            <button id="btn-walk-right" class="dpad-btn right">▶</button>
        </div>
    </div>

    <!-- 3D Görüntüleyici Konteyneri -->
    <div id="viewer-container"></div>

    <!-- Ana Uygulama Başlangıcı -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
