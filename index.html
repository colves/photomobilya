<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PhotoMobilya - 3D Mutfak Önizleme</title>
    
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Three.js Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <!-- Yükleme Ekranı -->
    <div id="loader" class="overlay">
        <div class="spinner"></div>
        <p id="loader-text">Sahne Yükleniyor...</p>
    </div>

    <!-- Hata Ekranı -->
    <div id="error-screen" class="overlay hidden">
        <div class="error-box">
            <h2>Bir Hata Oluştu</h2>
            <p id="error-text"></p>
            <button id="btn-error-close" class="cam-btn" style="margin-top:16px;">Tamam</button>
        </div>
    </div>

    <!-- Bilgi Alanı -->
    <div id="info-overlay">
        <h1>PhotoMobilya</h1>
        <h2>3D Mutfak Önizleme</h2>
        <p>Görüntüyü sürükleyerek inceleyin.</p>
        <div class="model-picker-container">
            <label for="model-upload" class="model-upload-btn">Model Seç (.glb)</label>
            <input type="file" id="model-upload" accept=".glb" class="hidden-input">
        </div>
    </div>

    <!-- Kamera Kontrolleri (İnceleme modunda görünür) -->
    <div id="camera-controls" class="hidden">
        <button id="btn-view-reset" class="cam-btn" title="Görünümü Sıfırla">Sıfırla</button>
        <button id="btn-view-front" class="cam-btn" title="Ön Görünüm">Ön</button>
        <button id="btn-view-side" class="cam-btn" title="Yan Görünüm">Yan</button>
        <button id="btn-view-top" class="cam-btn" title="Üstten Görünüm">Üst</button>
    </div>

    <!-- Malzeme Seçenekleri Paneli -->
    <aside id="config-panel" class="hidden ayar-paneli">
        <div class="ayar-govde">
            <section class="ayar-bolum">
                <p class="ayar-no"><span>01</span> / YÜZEY</p>
                <div class="ayar-bolum-basi">
                    <h2 class="ayar-baslik">Kapak Rengi</h2>
                </div>
                <div class="renk-secenekleri" id="door-options">
                    <button class="renk-btn active" data-type="door" data-val="white">
                        <span class="renk-nokta" style="background-color: #eaeaea;"></span>
                        <span class="renk-ad">Beyaz</span>
                    </button>
                    <button class="renk-btn" data-type="door" data-val="wood">
                        <span class="renk-nokta" style="background-color: #a47c54;"></span>
                        <span class="renk-ad">Ahşap</span>
                    </button>
                    <button class="renk-btn" data-type="door" data-val="anthracite">
                        <span class="renk-nokta" style="background-color: #2b2b2b;"></span>
                        <span class="renk-ad">Antrasit</span>
                    </button>
                </div>
            </section>

            <section class="ayar-bolum">
                <p class="ayar-no"><span>02</span> / TEZGÂH</p>
                <div class="ayar-bolum-basi">
                    <h2 class="ayar-baslik">Tezgâh Görünümü</h2>
                </div>
                <div class="renk-secenekleri" id="worktop-options">
                    <button class="renk-btn active" data-type="worktop" data-val="dark-stone">
                        <span class="renk-nokta" style="background-color: #222222;"></span>
                        <span class="renk-ad">Koyu Taş</span>
                    </button>
                    <button class="renk-btn" data-type="worktop" data-val="light-stone">
                        <span class="renk-nokta" style="background-color: #cccccc;"></span>
                        <span class="renk-ad">Açık Taş</span>
                    </button>
                    <button class="renk-btn" data-type="worktop" data-val="white-marble">
                        <span class="renk-nokta" style="background-color: #fafafa; border: 1px solid #ddd;"></span>
                        <span class="renk-ad">Beyaz Mermer</span>
                    </button>
                </div>
            </section>
        </div>
    </aside>

    <!-- 3D Görüntüleyici Konteyneri -->
    <div id="viewer-container"></div>

    <!-- Ana Uygulama Başlangıcı -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
